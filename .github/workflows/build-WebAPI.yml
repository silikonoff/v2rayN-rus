name: WebAPI checks

on:
  pull_request:
    paths:
      - 'v2rayN/v2rayN.WebAPI/**'
      - 'v2rayN/ServiceLib/**'
      - 'v2rayN/ServiceLib.Tests/**'
      - 'v2rayN/Directory.Build.*'
      - 'v2rayN/Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/build-WebAPI.yml'
  push:
    branches: [master]
    paths:
      - 'v2rayN/v2rayN.WebAPI/**'
      - 'v2rayN/ServiceLib/**'
      - 'v2rayN/ServiceLib.Tests/**'
      - 'v2rayN/Directory.Build.*'
      - 'v2rayN/Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/build-WebAPI.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      TUNIT_MAX_PARALLEL_TESTS: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - name: Test WebAPI and ServiceLib
        run: |
          dotnet test --project v2rayN/v2rayN.WebAPI/Tests/v2rayN.WebAPI.Tests.csproj -c Release
          dotnet test --project v2rayN/ServiceLib.Tests/ServiceLib.Tests.csproj -c Release

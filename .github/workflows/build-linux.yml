name: release Linux

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      target: linux

  release-zip:
    if: inputs.release_tag != ''
    needs: build
    uses: ./.github/workflows/package-zip.yml
    with:
      target: linux
      release_tag: ${{ inputs.release_tag }}
    secrets: inherit

  build-aot:
    uses: ./.github/workflows/build.yml
    with:
      target: linux
      isAot: true

  release-aot-zip:
    if: inputs.release_tag != ''
    needs: build-aot
    uses: ./.github/workflows/package-zip.yml
    with:
      target: linux
      release_tag: ${{ inputs.release_tag }}
      isAot: true
    secrets: inherit

name: Documentation checks

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check_docs.py'
      - '.github/workflows/docs.yml'
  push:
    branches: [master]
    paths:
      - '**/*.md'
      - 'scripts/check_docs.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: python scripts/check_docs.py
